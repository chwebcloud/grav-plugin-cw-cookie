PLUGIN_CW_COOKIE:
  DASHBOARD: "CHWEB-Cookie"
  TITEL: "Cookies and privacy"
  TEXT: "We use cookies and similar technologies. Necessary cookies make the website work. With your consent, we also use services for statistics, marketing and external media. You can change or withdraw your choice at any time via «Cookie settings»."
  ALLE: "Accept all"
  NOTWENDIGE: "Necessary only"
  EINSTELLUNGEN: "Settings"
  DIALOG_TITEL: "Cookie settings"
  DIALOG_TEXT: "Choose which categories we may use. Necessary cookies are always active because the website does not work without them. Your choice applies until you change it."
  SPEICHERN: "Save selection"
  LINK: "Cookie settings"
  SCHLIESSEN: "Close"
  IMMER_AKTIV: "Always active"
  DIENSTE_ZEIGEN: "Show services ({anzahl})"
  ANBIETER: "Provider"
  COOKIES: "Cookies"
  DATENSCHUTZ: "Privacy policy"
  IMPRESSUM: "Legal notice"
  DATENSCHUTZ_ANBIETER: "Privacy policy of the provider"
  PLATZHALTER_TITEL: "External content"
  PLATZHALTER_TEXT: "Content from {anbieter} is shown here. Loading it transfers data such as your IP address to {anbieter}. This requires your consent to the category «{kategorie}»."
  PLATZHALTER_LADEN: "Load content"
  PLATZHALTER_IMMER: "Always allow «{kategorie}»"
  SCHWEBEND: "Open cookie settings"
  KAT_NOTWENDIG_TITEL: "Necessary"
  KAT_NOTWENDIG_TEXT: "The website needs these cookies to work securely, for example for forms and to remember your cookie choice. They cannot be deselected."
  KAT_STATISTIK_TITEL: "Statistics"
  KAT_STATISTIK_TEXT: "Helps us understand how the website is used so we can improve it. The data is evaluated in aggregate."
  KAT_MARKETING_TITEL: "Marketing"
  KAT_MARKETING_TEXT: "Used to measure advertising and to show relevant offers on other websites."
  KAT_MEDIEN_TITEL: "External media and comfort"
  KAT_MEDIEN_TEXT: "Allows content from other providers, for example videos, maps or calendars. Data is transferred to these providers."
  DIENST_GTM: "Manages the integration of statistics and marketing services on this website."
  DIENST_GA4: "Statistics on website usage (page views, time spent, origin)."
  TAB_ALLGEMEIN_TITLE: "General"
  ENABLED_LABEL: "Cookie banner active"
  VERSION_LABEL: "Consent version"
  VERSION_HELP: "Raise the number when new services are added or the privacy policy changes substantially. The banner is then shown to everyone again."
  LAUFZEIT_TAGE_LABEL: "Remember the choice (days)"
  LAUFZEIT_TAGE_HELP: "After this time the question is asked again. 180 to 365 days is usual."
  DATENSCHUTZ_URL_LABEL: "Privacy policy page"
  DATENSCHUTZ_URL_PLACEHOLDER: "/privacy"
  DATENSCHUTZ_URL_HELP: "Path of the page (for example /privacy) or a full address. It is linked in the banner."
  IMPRESSUM_URL_LABEL: "Imprint page"
  IMPRESSUM_URL_PLACEHOLDER: "/imprint"
  AUSNAHMEN_LABEL: "No banner on these paths"
  DEFAULT_HELP: "On these paths (and everything below them) neither the banner nor the Google integration appears. Single pages are excluded with «cw_cookie: false» in the page header."
  TAB_TEXTE_TITLE: "Texts"
  TEXTE_TITEL_LABEL: "Banner heading"
  TEXTE_TITEL_PLACEHOLDER: "Cookies and privacy"
  TEXTE_TEXT_LABEL: "Banner text"
  TEXTE_TEXT_PLACEHOLDER: "We use cookies and similar techniques. Necessary cookies keep the website working. …"
  TEXTE_TEXT_HELP: "Short and honest: what for, which categories, and that the choice can be changed. Markdown is allowed, for example [link](/page)."
  TEXTE_ALLE_LABEL: "Button «Accept all»"
  TEXTE_ALLE_PLACEHOLDER: "Accept all"
  TEXTE_NOTWENDIGE_LABEL: "Button «Essential only»"
  TEXTE_NOTWENDIGE_PLACEHOLDER: "Essential only"
  TEXTE_EINSTELLUNGEN_LABEL: "Button «Settings»"
  TEXTE_EINSTELLUNGEN_PLACEHOLDER: "Settings"
  TEXTE_DIALOG_TITEL_LABEL: "Heading in the settings dialog"
  TEXTE_DIALOG_TITEL_PLACEHOLDER: "Cookie settings"
  TEXTE_DIALOG_TEXT_LABEL: "Introduction in the settings dialog"
  TEXTE_DIALOG_TEXT_PLACEHOLDER: "Here you decide which categories we may use. …"
  TEXTE_SPEICHERN_LABEL: "Button «Save selection»"
  TEXTE_SPEICHERN_PLACEHOLDER: "Save selection"
  TEXTE_LINK_LABEL: "Text of the «Cookie settings» link"
  TEXTE_LINK_PLACEHOLDER: "Cookie settings"
  TEXTE_LINK_HELP: "Default text of the Twig function cw_cookie_link()."
  TAB_KATEGORIEN_TITLE: "Categories"
  KATEGORIEN_LABEL: "Categories"
  KEY_LABEL: "Key"
  KEY_PLACEHOLDER: "statistics"
  KEY_HELP: "Lower-case letters, digits, - and _ only. Existing: notwendig, statistik, marketing, medien."
  TITEL_LABEL: "Title"
  BESCHREIBUNG_LABEL: "Description"
  NOTWENDIG_LABEL: "Necessary (always on)"
  AKTIV_LABEL: "Show in the dialog"
  GOOGLE_LABEL: "Allowed in Google Consent Mode"
  GOOGLE_ANALYTICS_STORAGE_OPTION: "analytics_storage (statistics)"
  GOOGLE_AD_STORAGE_OPTION: "ad_storage (advertising cookies)"
  GOOGLE_AD_USER_DATA_OPTION: "ad_user_data (send user data to Google)"
  GOOGLE_AD_PERSONALIZATION_OPTION: "ad_personalization (personalised advertising)"
  GOOGLE_PERSONALIZATION_STORAGE_OPTION: "personalization_storage (personalisation)"
  GOOGLE_FUNCTIONALITY_STORAGE_OPTION: "functionality_storage (functionality)"
  GOOGLE_SECURITY_STORAGE_OPTION: "security_storage (security)"
  GOOGLE_HELP: "Which Google signals are set to «granted» with this category. Default: statistics = analytics_storage; marketing = ad_storage, ad_user_data, ad_personalization."
  TAB_GOOGLE_TITLE: "Google"
  GOOGLE_CONSENT_MODE_LABEL: "Google Consent Mode v2"
  GOOGLE_CONSENT_MODE_HELP: "Tells Google «not consented» before any tag, and the new state after the choice. Required by Google for advertising and analytics in the EEA. Switched off, Google tags load only after consent."
  GOOGLE_WAIT_FOR_UPDATE_LABEL: "Wait for the choice (milliseconds)"
  GOOGLE_WAIT_FOR_UPDATE_HELP: "How long Google tags wait on load for a stored consent. Google recommends 500."
  GOOGLE_ADS_DATA_REDACTION_LABEL: "Redact advertising data until consent is given"
  GOOGLE_ADS_DATA_REDACTION_HELP: "ads_data_redaction: click identifiers are not transmitted without consent."
  GOOGLE_URL_PASSTHROUGH_LABEL: "Pass click identifiers through the address"
  GOOGLE_URL_PASSTHROUGH_HELP: "url_passthrough: only needed for Google Ads campaigns. When in doubt, leave it off."
  GTM_BEREICH_TITLE: "Google Tag Manager"
  GOOGLE_GTM_ID_LABEL: "Container ID"
  GOOGLE_GTM_ID_PLACEHOLDER: "GTM-XXXXXXX"
  GOOGLE_GTM_ID_HELP: "In Tag Manager, top right next to the workspace. Leave empty if no Tag Manager is used."
  GOOGLE_GTM_LADEN_LABEL: "Load Tag Manager"
  GOOGLE_GTM_LADEN_IMMER_OPTION: "Always – Consent Mode governs what is measured (recommended)"
  GOOGLE_GTM_LADEN_ZUSTIMMUNG_OPTION: "Only after consent"
  GOOGLE_GTM_LADEN_HELP: "«Always»: Tag Manager starts immediately and every Google tag inside it obeys the consent. «Only after consent»: nothing from Google loads without consent, and Tag Manager starts with the category chosen below."
  GOOGLE_GTM_KATEGORIE_LABEL: "Category for Tag Manager"
  GOOGLE_GTM_KATEGORIE_STATISTIK_OPTION: "Statistics"
  GOOGLE_GTM_KATEGORIE_MARKETING_OPTION: "Marketing"
  GOOGLE_GTM_KATEGORIE_MEDIEN_OPTION: "External media and convenience"
  GOOGLE_GTM_KATEGORIE_HELP: "Only with «Only after consent»: this category has to be allowed. Tag Manager appears in the dialog under it."
  GOOGLE_GTM_NOSCRIPT_LABEL: "Output the noscript part"
  GOOGLE_GTM_NOSCRIPT_HELP: "The second part of the Google code, right after <body>, for browsers without JavaScript. Only with «Always»; with «Only after consent» it is pointless, because nobody can consent without JavaScript."
  GA4_BEREICH_TITLE: "Google Analytics 4 (direct, without Tag Manager)"
  GOOGLE_GA4_ID_LABEL: "Measurement ID"
  GOOGLE_GA4_ID_PLACEHOLDER: "G-XXXXXXXXXX"
  GOOGLE_GA4_ID_HELP: "In Google Analytics under Admin › Data streams. It is ignored as soon as a Tag Manager ID is entered."
  GOOGLE_GA4_LADEN_LABEL: "Load Google Analytics"
  GOOGLE_GA4_LADEN_ZUSTIMMUNG_OPTION: "Only after consent (recommended)"
  GOOGLE_GA4_LADEN_IMMER_OPTION: "Always – Consent Mode, cookieless signals without consent"
  GOOGLE_GA4_LADEN_HELP: "«Only after consent»: only visitors who allow statistics are measured. «Always»: Google also receives anonymous, cookieless signals without consent (advanced Consent Mode)."
  GOOGLE_GA4_KATEGORIE_LABEL: "Category for Google Analytics"
  GOOGLE_GA4_KATEGORIE_STATISTIK_OPTION: "Statistics"
  GOOGLE_GA4_KATEGORIE_MARKETING_OPTION: "Marketing"
  GOOGLE_GA4_KATEGORIE_MEDIEN_OPTION: "External media and convenience"
  TAB_DIENSTE_TITLE: "Further services"
  DIENSTE_LABEL: "Services"
  NAME_LABEL: "Name"
  NAME_PLACEHOLDER: "Matomo"
  KATEGORIE_LABEL: "Category"
  KATEGORIE_STATISTIK_OPTION: "Statistics"
  KATEGORIE_MARKETING_OPTION: "Marketing"
  KATEGORIE_MEDIEN_OPTION: "External media and convenience"
  KATEGORIE_NOTWENDIG_OPTION: "Necessary"
  AKTIV_LABEL_2: "Active"
  ANBIETER_LABEL: "Provider"
  ANBIETER_PLACEHOLDER: "Company, place"
  BESCHREIBUNG_LABEL_2: "What is the service for?"
  DATENSCHUTZ_URL_LABEL_2: "Privacy policy of the provider"
  DATENSCHUTZ_URL_PLACEHOLDER_2: "https://…"
  COOKIES_LABEL: "Cookies of the service"
  COOKIES_PLACEHOLDER: "_pk_id*, _pk_ses*"
  COOKIES_HELP: "Names separated by commas, * at the end for «starts with». They are listed in the dialog and deleted when consent is withdrawn."
  SCRIPT_URL_LABEL: "Script address"
  SCRIPT_URL_PLACEHOLDER: "https://cdn.example.com/script.js"
  INLINE_CODE_LABEL: "Inline code"
  INLINE_CODE_HELP: "JavaScript of the provider. The whole embed code including <script> tags works too; <noscript> parts are left out."
  POSITION_LABEL: "Position in the page"
  POSITION_HEAD_OPTION: "In the head (<head>)"
  POSITION_BODY_OPTION: "At the end of the page (before </body>)"
  TAB_DARSTELLUNG_TITLE: "Appearance"
  DARSTELLUNG_LEITFARBE_LABEL: "Accent colour"
  DARSTELLUNG_LEITFARBE_HELP: "Colour of the buttons, switches and accents. The text on the buttons turns white or black automatically, whichever reads better."
  DARSTELLUNG_POSITION_LABEL: "Position of the banner"
  DARSTELLUNG_POSITION_LEISTE_OPTION: "Bar at the bottom"
  DARSTELLUNG_POSITION_BOX_LINKS_OPTION: "Box at the bottom left"
  DARSTELLUNG_POSITION_BOX_RECHTS_OPTION: "Box at the bottom right"
  DARSTELLUNG_FARBSCHEMA_LABEL: "Colour scheme"
  DARSTELLUNG_FARBSCHEMA_HELL_OPTION: "Always light"
  DARSTELLUNG_FARBSCHEMA_AUTO_OPTION: "Follow the device (light or dark)"
  DARSTELLUNG_RADIUS_LABEL: "Corner radius (pixels)"
  DARSTELLUNG_SCHWEBENDER_KNOPF_LABEL: "Floating «Cookie settings» button"
  DARSTELLUNG_SCHWEBENDER_KNOPF_HELP: "A small round button in the corner, visible after the choice. Needed when the site has no «Cookie settings» link elsewhere: withdrawing consent has to be as easy as giving it."
  DARSTELLUNG_SCHWEBENDER_KNOPF_SEITE_LABEL: "Corner for the floating button"
  DARSTELLUNG_SCHWEBENDER_KNOPF_SEITE_LINKS_OPTION: "Bottom left"
  DARSTELLUNG_SCHWEBENDER_KNOPF_SEITE_RECHTS_OPTION: "Bottom right"
  DARSTELLUNG_CSS_LADEN_LABEL: "Load the plugin's own CSS"
  DARSTELLUNG_CSS_LADEN_HELP: "Only switch this off when the theme styles the banner and dialog itself."
