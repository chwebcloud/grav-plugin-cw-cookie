  TEXTE_DIALOG_TEXT_PLACEHOLDER: "Ici, vous décidez quelles catégories nous pouvons utiliser. …"
  TEXTE_SPEICHERN_LABEL: "Bouton «Enregistrer la sélection»"
  TEXTE_SPEICHERN_PLACEHOLDER: "Enregistrer la sélection"
  TEXTE_LINK_LABEL: "Texte du lien «Paramètres des cookies»"
  TEXTE_LINK_PLACEHOLDER: "Paramètres des cookies"
  TEXTE_LINK_HELP: "Texte par défaut de la fonction Twig cw_cookie_link()."
  TAB_KATEGORIEN_TITLE: "Catégories"
  KATEGORIEN_LABEL: "Catégories"
  KEY_LABEL: "Clé"
  KEY_PLACEHOLDER: "statistiques"
  KEY_HELP: "Uniquement minuscules, chiffres, - et _. Existantes: notwendig, statistik, marketing, medien."
  TITEL_LABEL: "Titre"
  BESCHREIBUNG_LABEL: "Description"
  NOTWENDIG_LABEL: "Nécessaire (toujours actif)"
  AKTIV_LABEL: "Afficher dans la fenêtre"
  GOOGLE_LABEL: "Autorisé dans le Google Consent Mode"
  GOOGLE_ANALYTICS_STORAGE_OPTION: "analytics_storage (statistiques)"
  GOOGLE_AD_STORAGE_OPTION: "ad_storage (cookies publicitaires)"
  GOOGLE_AD_USER_DATA_OPTION: "ad_user_data (envoyer des données utilisateur à Google)"
  GOOGLE_AD_PERSONALIZATION_OPTION: "ad_personalization (publicité personnalisée)"
  GOOGLE_PERSONALIZATION_STORAGE_OPTION: "personalization_storage (personnalisation)"
  GOOGLE_FUNCTIONALITY_STORAGE_OPTION: "functionality_storage (fonctionnement)"
  GOOGLE_SECURITY_STORAGE_OPTION: "security_storage (sécurité)"
  GOOGLE_HELP: "Quels signaux Google passent à «autorisé» avec cette catégorie. Par défaut: statistiques = analytics_storage; marketing = ad_storage, ad_user_data, ad_personalization."
  TAB_GOOGLE_TITLE: "Google"
  GOOGLE_CONSENT_MODE_LABEL: "Google Consent Mode v2"
  GOOGLE_CONSENT_MODE_HELP: "Indique à Google «pas de consentement» avant chaque balise, puis le nouvel état après le choix. Exigé par Google pour la publicité et l'analyse dans l'EEE. Désactivé, les balises Google ne se chargent qu'après le consentement."
  GOOGLE_WAIT_FOR_UPDATE_LABEL: "Attente de la décision (millisecondes)"
  GOOGLE_WAIT_FOR_UPDATE_HELP: "Durée pendant laquelle les balises Google attendent un consentement enregistré. Google recommande 500."
  GOOGLE_ADS_DATA_REDACTION_LABEL: "Masquer les données publicitaires tant qu'il n'y a pas de consentement"
  GOOGLE_ADS_DATA_REDACTION_HELP: "ads_data_redaction: les identifiants de clic ne sont pas transmis sans consentement."
  GOOGLE_URL_PASSTHROUGH_LABEL: "Transmettre les identifiants de clic via l'adresse"
  GOOGLE_URL_PASSTHROUGH_HELP: "url_passthrough: nécessaire uniquement pour les campagnes Google Ads. En cas de doute, laissez désactivé."
  GTM_BEREICH_TITLE: "Google Tag Manager"
  GOOGLE_GTM_ID_LABEL: "ID du conteneur"
  GOOGLE_GTM_ID_PLACEHOLDER: "GTM-XXXXXXX"
  GOOGLE_GTM_ID_HELP: "Dans Tag Manager, en haut à droite à côté de l'espace de travail. Laissez vide si aucun Tag Manager n'est utilisé."
  GOOGLE_GTM_LADEN_LABEL: "Charger Tag Manager"
  GOOGLE_GTM_LADEN_IMMER_OPTION: "Toujours – le Consent Mode règle ce qui est mesuré (recommandé)"
  GOOGLE_GTM_LADEN_ZUSTIMMUNG_OPTION: "Seulement après le consentement"
  GOOGLE_GTM_LADEN_HELP: "«Toujours»: Tag Manager démarre immédiatement et chaque balise Google qu'il contient respecte le consentement. «Seulement après le consentement»: rien de Google ne se charge sans consentement, et Tag Manager démarre avec la catégorie choisie ci-dessous."
  GOOGLE_GTM_KATEGORIE_LABEL: "Catégorie pour Tag Manager"
  GOOGLE_GTM_KATEGORIE_STATISTIK_OPTION: "Statistiques"
  GOOGLE_GTM_KATEGORIE_MARKETING_OPTION: "Marketing"
  GOOGLE_GTM_KATEGORIE_MEDIEN_OPTION: "Médias externes et confort"
  GOOGLE_GTM_KATEGORIE_HELP: "Uniquement avec «Seulement après le consentement»: cette catégorie doit être autorisée. Tag Manager apparaît dans la fenêtre sous celle-ci."
  GOOGLE_GTM_NOSCRIPT_LABEL: "Générer la partie noscript"
  GOOGLE_GTM_NOSCRIPT_HELP: "La seconde partie du code Google, juste après <body>, pour les navigateurs sans JavaScript. Uniquement avec «Toujours»; avec «Seulement après le consentement», elle n'a pas de sens, car personne ne peut consentir sans JavaScript."
  GA4_BEREICH_TITLE: "Google Analytics 4 (directement, sans Tag Manager)"
  GOOGLE_GA4_ID_LABEL: "ID de mesure"
  GOOGLE_GA4_ID_PLACEHOLDER: "G-XXXXXXXXXX"
  GOOGLE_GA4_ID_HELP: "Dans Google Analytics sous Administration › Flux de données. Elle est ignorée dès qu'un ID Tag Manager est saisi."
  GOOGLE_GA4_LADEN_LABEL: "Charger Google Analytics"
  GOOGLE_GA4_LADEN_ZUSTIMMUNG_OPTION: "Seulement après le consentement (recommandé)"
  GOOGLE_GA4_LADEN_IMMER_OPTION: "Toujours – Consent Mode, signaux sans cookies en l'absence de consentement"
  GOOGLE_GA4_LADEN_HELP: "«Seulement après le consentement»: seuls les visiteurs qui autorisent les statistiques sont mesurés. «Toujours»: Google reçoit aussi des signaux anonymes sans cookies en l'absence de consentement (Consent Mode avancé)."
  GOOGLE_GA4_KATEGORIE_LABEL: "Catégorie pour Google Analytics"
  GOOGLE_GA4_KATEGORIE_STATISTIK_OPTION: "Statistiques"
  GOOGLE_GA4_KATEGORIE_MARKETING_OPTION: "Marketing"
  GOOGLE_GA4_KATEGORIE_MEDIEN_OPTION: "Médias externes et confort"
