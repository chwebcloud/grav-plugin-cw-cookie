PLUGIN_CW_COOKIE:
  DASHBOARD: "CHWEB-Cookie"
  TITEL: "Cookies et protection des données"
  TEXT: "Nous utilisons des cookies et des techniques similaires. Les cookies nécessaires assurent le fonctionnement du site. Avec votre consentement, nous utilisons en plus des services de statistique, de marketing et de médias externes. Vous pouvez modifier ou révoquer votre choix à tout moment via «Paramètres des cookies»."
  ALLE: "Tout accepter"
  NOTWENDIGE: "Uniquement les nécessaires"
  EINSTELLUNGEN: "Paramètres"
  DIALOG_TITEL: "Paramètres des cookies"
  DIALOG_TEXT: "Choisissez les catégories que nous pouvons utiliser. Les cookies nécessaires sont toujours actifs, car le site ne fonctionne pas sans eux. Votre choix reste valable jusqu’à ce que vous le modifiiez."
  SPEICHERN: "Enregistrer la sélection"
  LINK: "Paramètres des cookies"
  SCHLIESSEN: "Fermer"
  IMMER_AKTIV: "Toujours actif"
  DIENSTE_ZEIGEN: "Afficher les services ({anzahl})"
  ANBIETER: "Fournisseur"
  COOKIES: "Cookies"
  DATENSCHUTZ: "Déclaration de protection des données"
  IMPRESSUM: "Mentions légales"
  DATENSCHUTZ_ANBIETER: "Déclaration de protection des données du fournisseur"
  PLATZHALTER_TITEL: "Contenu externe"
  PLATZHALTER_TEXT: "Un contenu de {anbieter} s’affiche ici. Son chargement transmet des données telles que votre adresse IP à {anbieter}. Cela nécessite votre consentement à la catégorie «{kategorie}»."
  PLATZHALTER_LADEN: "Charger le contenu"
  PLATZHALTER_IMMER: "Toujours autoriser «{kategorie}»"
  SCHWEBEND: "Ouvrir les paramètres des cookies"
  KAT_NOTWENDIG_TITEL: "Nécessaires"
  KAT_NOTWENDIG_TEXT: "Le site a besoin de ces cookies pour fonctionner en toute sécurité, par exemple pour les formulaires et pour enregistrer votre choix de cookies. Ils ne peuvent pas être désactivés."
  KAT_STATISTIK_TITEL: "Statistiques"
  KAT_STATISTIK_TEXT: "Nous aide à comprendre comment le site est utilisé afin de l’améliorer. Les données sont évaluées de manière agrégée."
  KAT_MARKETING_TITEL: "Marketing"
  KAT_MARKETING_TEXT: "Sert à mesurer la publicité et à afficher des offres adaptées sur d’autres sites."
  KAT_MEDIEN_TITEL: "Médias externes et confort"
  KAT_MEDIEN_TEXT: "Autorise des contenus d’autres fournisseurs, par exemple des vidéos, des cartes ou des calendriers. Des données sont alors transmises à ces fournisseurs."
  DIENST_GTM: "Gère l’intégration des services de statistique et de marketing sur ce site."
  DIENST_GA4: "Statistiques sur l’utilisation du site (pages vues, durée, provenance)."
  TAB_ALLGEMEIN_TITLE: "Général"
  ENABLED_LABEL: "Bandeau cookies actif"
  VERSION_LABEL: "Version du consentement"
  VERSION_HELP: "Augmentez le nombre lorsque de nouveaux services s'ajoutent ou que la déclaration de confidentialité change sensiblement. Le bandeau réapparaît alors pour tout le monde."
  LAUFZEIT_TAGE_LABEL: "Mémoriser le choix (jours)"
  LAUFZEIT_TAGE_HELP: "Passé ce délai, la question est posée à nouveau. 180 à 365 jours est courant."
  DATENSCHUTZ_URL_LABEL: "Page de la déclaration de confidentialité"
  DATENSCHUTZ_URL_PLACEHOLDER: "/confidentialite"
  DATENSCHUTZ_URL_HELP: "Chemin de la page (par exemple /confidentialite) ou adresse complète. Le lien figure dans le bandeau."
  IMPRESSUM_URL_LABEL: "Page des mentions légales"
  IMPRESSUM_URL_PLACEHOLDER: "/mentions-legales"
  AUSNAHMEN_LABEL: "Pas de bandeau sur ces chemins"
  DEFAULT_HELP: "Sur ces chemins (et tout ce qui se trouve en dessous), ni le bandeau ni l'intégration Google n'apparaissent. Une page isolée s'exclut avec «cw_cookie: false» dans son en-tête."
  TAB_TEXTE_TITLE: "Textes"
  TEXTE_TITEL_LABEL: "Titre du bandeau"
  TEXTE_TITEL_PLACEHOLDER: "Cookies et confidentialité"
  TEXTE_TEXT_LABEL: "Texte du bandeau"
  TEXTE_TEXT_PLACEHOLDER: "Nous utilisons des cookies et des techniques similaires. Les cookies nécessaires font fonctionner le site. …"
  TEXTE_TEXT_HELP: "Court et honnête: à quoi cela sert, quelles catégories, et que le choix peut être modifié. Le markdown est autorisé, par exemple [lien](/page)."
  TEXTE_ALLE_LABEL: "Bouton «Tout accepter»"
  TEXTE_ALLE_PLACEHOLDER: "Tout accepter"
  TEXTE_NOTWENDIGE_LABEL: "Bouton «Nécessaires uniquement»"
  TEXTE_NOTWENDIGE_PLACEHOLDER: "Nécessaires uniquement"
  TEXTE_EINSTELLUNGEN_LABEL: "Bouton «Paramètres»"
  TEXTE_EINSTELLUNGEN_PLACEHOLDER: "Paramètres"
  TEXTE_DIALOG_TITEL_LABEL: "Titre de la fenêtre de paramètres"
  TEXTE_DIALOG_TITEL_PLACEHOLDER: "Paramètres des cookies"
