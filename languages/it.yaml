  PLATZHALTER_TITEL: "Contenuto esterno"
  PLATZHALTER_TEXT: "Qui viene mostrato un contenuto di {anbieter}. Caricandolo, dati come il vostro indirizzo IP vengono trasmessi a {anbieter}. Per questo serve il vostro consenso alla categoria «{kategorie}»."
  PLATZHALTER_LADEN: "Carica il contenuto"
  PLATZHALTER_IMMER: "Consenti sempre «{kategorie}»"
  SCHWEBEND: "Apri le impostazioni dei cookie"
  KAT_NOTWENDIG_TITEL: "Necessari"
  KAT_NOTWENDIG_TEXT: "Il sito ha bisogno di questi cookie per funzionare in modo sicuro, ad esempio per i moduli e per memorizzare la vostra scelta sui cookie. Non possono essere disattivati."
  KAT_STATISTIK_TITEL: "Statistiche"
  KAT_STATISTIK_TEXT: "Ci aiuta a capire come viene utilizzato il sito, per poterlo migliorare. I dati vengono valutati in forma aggregata."
  KAT_MARKETING_TITEL: "Marketing"
  KAT_MARKETING_TEXT: "Serve a misurare la pubblicità e a mostrare offerte pertinenti su altri siti."
  KAT_MEDIEN_TITEL: "Media esterni e comfort"
  KAT_MEDIEN_TEXT: "Consente contenuti di altri fornitori, ad esempio video, mappe o calendari. In tal caso i dati vengono trasmessi a questi fornitori."
  DIENST_GTM: "Gestisce l’integrazione dei servizi di statistica e marketing su questo sito."
