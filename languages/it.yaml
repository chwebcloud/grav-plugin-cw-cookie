  GOOGLE_GTM_LADEN_IMMER_OPTION: "Sempre – il Consent Mode regola che cosa viene misurato (consigliato)"
  GOOGLE_GTM_LADEN_ZUSTIMMUNG_OPTION: "Solo dopo il consenso"
  GOOGLE_GTM_LADEN_HELP: "«Sempre»: Tag Manager parte subito e ogni tag di Google al suo interno rispetta il consenso. «Solo dopo il consenso»: senza consenso non viene caricato nulla di Google e Tag Manager parte con la categoria scelta qui sotto."
