  NOTWENDIGE: "Solo necessari"
  EINSTELLUNGEN: "Impostazioni"
  DIALOG_TITEL: "Impostazioni dei cookie"
  DIALOG_TEXT: "Scegliete quali categorie possiamo utilizzare. I cookie necessari sono sempre attivi, perché senza di essi il sito non funziona. La vostra scelta vale finché non la modificate."
