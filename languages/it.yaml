  GOOGLE_GTM_NOSCRIPT_LABEL: "Generare la parte noscript"
  GOOGLE_GTM_NOSCRIPT_HELP: "La seconda parte del codice di Google, subito dopo <body>, per browser senza JavaScript. Solo con «Sempre»; con «Solo dopo il consenso» non ha senso, perché senza JavaScript nessuno può acconsentire."
