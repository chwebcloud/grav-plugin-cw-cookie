  DARSTELLUNG_LEITFARBE_LABEL: "Colore principale"
  DARSTELLUNG_LEITFARBE_HELP: "Colore di pulsanti, interruttori e accenti. Il testo sui pulsanti diventa automaticamente bianco o nero, a seconda di che cosa si legge meglio."
