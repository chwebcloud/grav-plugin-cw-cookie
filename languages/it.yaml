  DARSTELLUNG_FARBSCHEMA_AUTO_OPTION: "Come il dispositivo (chiaro o scuro)"
  DARSTELLUNG_RADIUS_LABEL: "Raggio degli angoli (pixel)"
  DARSTELLUNG_SCHWEBENDER_KNOPF_LABEL: "Pulsante flottante «Impostazioni dei cookie»"
  DARSTELLUNG_SCHWEBENDER_KNOPF_HELP: "Un piccolo pulsante rotondo nell'angolo, visibile dopo la scelta. Necessario se il sito non ha altrove un collegamento «Impostazioni dei cookie»: revocare deve essere semplice quanto acconsentire."
  DARSTELLUNG_SCHWEBENDER_KNOPF_SEITE_LABEL: "Angolo del pulsante flottante"
  DARSTELLUNG_SCHWEBENDER_KNOPF_SEITE_LINKS_OPTION: "In basso a sinistra"
  DARSTELLUNG_SCHWEBENDER_KNOPF_SEITE_RECHTS_OPTION: "In basso a destra"
  DARSTELLUNG_CSS_LADEN_LABEL: "Caricare il CSS proprio del plugin"
  DARSTELLUNG_CSS_LADEN_HELP: "Disattivare solo se il tema definisce da sé l'aspetto di banner e finestra."
  HINWEIS_BANNER: "Il banner compare alla prima visita e resta finché non viene fatta una scelta. Il consenso è salvato **solo nel browser** (cookie `cw_consent`), mai sul server. Un collegamento per riaprire la finestra si inserisce nel tema con la funzione Twig `cw_cookie_link()` o con un qualsiasi elemento con l’attributo `data-cw-cookie-oeffnen`."
  HINWEIS_TEXTE: "I campi vuoti mostrano il testo predefinito nella lingua della pagina (tedesco, francese, italiano, inglese). Compilarli solo se si desidera una formulazione propria."
  HINWEIS_KATEGORIEN: "Ogni categoria compare nella finestra delle impostazioni con il proprio interruttore. **Necessario** è sempre attivo e non disattivabile. La **chiave** serve ad assegnare servizi e contenuti incorporati a una categoria (`data-cw-cookie-kategorie=\"statistik\"`). Titolo o descrizione vuoti mostrano il testo predefinito."
  HINWEIS_GOOGLE: "Inserire **o** Google Tag Manager **o** Google Analytics 4. Se sono impostati entrambi, GA4 non viene incorporato direttamente (ogni visita verrebbe contata due volte) – in tal caso GA4 si configura nel Tag Manager. A ogni scelta il Tag Manager riceve l’evento `cw_consent_update` con la variabile `cw_consent` (per esempio `cw_consent.statistik`)."
  HINWEIS_DIENSTE: "Qui si inseriscono i servizi che possono caricarsi solo dopo il consenso: Matomo, pixel Meta, LinkedIn, Hotjar, una finestra di chat … Lo script viene scritto come `<script type=\"text/plain\">` bloccato e si carica solo quando la categoria scelta è consentita. Ogni servizio compare nella finestra delle impostazioni sotto la sua categoria."
  KATEGORIE_HINZUFUEGEN: "Aggiungi categoria"
  DIENST_HINZUFUEGEN: "Aggiungi servizio"
  HINWEIS_GTM_UNGUELTIG: "L’ID del contenitore GTM non ha la forma GTM-XXXXXXX e non viene incorporato."
  HINWEIS_GA4_UNGUELTIG: "L’ID di misurazione GA4 non ha la forma G-XXXXXXXXXX e non viene incorporato."
  HINWEIS_GA4_DOPPELT: "GTM e GA4 sono entrambi impostati. GA4 non viene quindi incorporato direttamente (ogni visita verrebbe contata due volte) – configurare GA4 nel Tag Manager."
  HINWEIS_CONSENT_MODE_AUS: "Consent Mode è disattivato: il Tag Manager si carica solo dopo il consenso."
  NACH_ZUSTIMMUNG: "dopo il consenso"
