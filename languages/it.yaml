PLUGIN_CW_COOKIE:
  DASHBOARD: "CHWEB-Cookie"
  TITEL: "Cookie e protezione dei dati"
  TEXT: "Utilizziamo cookie e tecniche simili. I cookie necessari garantiscono il funzionamento del sito. Con il vostro consenso utilizziamo inoltre servizi di statistica, marketing e media esterni. Potete modificare o revocare la vostra scelta in qualsiasi momento tramite «Impostazioni dei cookie»."
