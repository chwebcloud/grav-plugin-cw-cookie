  TAB_GOOGLE_TITLE: "Google"
  GOOGLE_CONSENT_MODE_LABEL: "Google Consent Mode v2"
  GOOGLE_CONSENT_MODE_HELP: "Comunica a Google «nessun consenso» prima di ogni tag e il nuovo stato dopo la scelta. Richiesto da Google per pubblicità e analisi nello SEE. Disattivato, i tag di Google si caricano solo dopo il consenso."
  GOOGLE_WAIT_FOR_UPDATE_LABEL: "Attesa della scelta (millisecondi)"
  GOOGLE_WAIT_FOR_UPDATE_HELP: "Quanto i tag di Google attendono al caricamento un consenso memorizzato. Google consiglia 500."
  GOOGLE_ADS_DATA_REDACTION_LABEL: "Oscurare i dati pubblicitari finché manca il consenso"
  GOOGLE_ADS_DATA_REDACTION_HELP: "ads_data_redaction: gli identificatori di clic non vengono trasmessi senza consenso."
  GOOGLE_URL_PASSTHROUGH_LABEL: "Trasmettere gli identificatori di clic tramite l'indirizzo"
  GOOGLE_URL_PASSTHROUGH_HELP: "url_passthrough: necessario solo per le campagne Google Ads. Nel dubbio, lasciare disattivato."
  GTM_BEREICH_TITLE: "Google Tag Manager"
