  GOOGLE_GA4_LADEN_HELP: "«Solo dopo il consenso»: vengono misurati solo i visitatori che consentono le statistiche. «Sempre»: Google riceve anche segnali anonimi senza cookie in assenza di consenso (Consent Mode avanzato)."
